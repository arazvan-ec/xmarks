name: Validate plugins

# Validates the marketplace catalog and every plugin manifest (plus skill/agent/
# hook frontmatter) with the Claude Code CLI. Runs in --strict mode so that
# unrecognized fields and missing metadata fail the build.

# No paths: filter, deliberately. The list here grew one entry at a time as
# gates were added, and it was already wrong once — it excluded the workflow
# check-supply-chain-pin.sh guards, so half of PR #81 changed with the gate
# never running (Codex P1). check-version-citations.sh (P47) reads EVERY
# tracked file, so no enumeration can be right for it: CLAUDE.md alone was
# outside the old list, and any file added later would be too. A filter and a
# whole-tree corpus cannot both be correct, and the cheap half of that trade is
# running this job on a PR that only touches LICENSE.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep CI runs offline-friendly: no auto-update or telemetry traffic.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: claude plugin validate . --strict

  test-installer:
    # End-to-end test of the vendored install path used for Claude Code web:
    # install twice (idempotence), assert the vendored result, then uninstall.
    # Also checks docs consistency: every skill/agent documented in README and
    # the /flywheel:help command map.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the test-pairing gate diffs against the PR base.
          fetch-depth: 0

      - name: Check script/test pairing (P22)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-pairing.sh "origin/${{ github.base_ref }}"

      - name: Check that a release-bearing change brought its release (P47)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-release-bump.sh "origin/${{ github.base_ref }}"

      - name: Check that upgrade-note citations resolve (P47)
        run: bash scripts/check-version-citations.sh

      - name: Check skill description budget (P24)
        run: bash scripts/check-description-budget.sh

      - name: Check skill invocation budget (P35)
        run: bash scripts/check-invocation-budget.sh

      - name: Check eval fixtures for grading leaks (P26)
        run: bash scripts/check-fixture-leaks.sh

      - name: Check hook wiring parity (P38)
        run: bash scripts/check-hook-parity.sh

      - name: Check agent registration parity (P41)
        run: bash scripts/check-agent-parity.sh

      - name: Check cycle telemetry (P42)
        run: bash scripts/check-telemetry.sh

      # Discovery, not a hand-written list. check-test-pairing.sh guarantees a
      # script arrives with its test; this guarantees the test is then run, so a
      # new one cannot sit in the tree never executed (which is what happened to
      # test-run-cost.sh for four releases). Every test is run before failing, so
      # one red does not hide the rest.
      - name: Run every scripts/test-*.sh
        run: |
          shopt -s nullglob
          tests=(scripts/test-*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no scripts/test-*.sh found — the discovery glob is broken"
            exit 1
          fi
          echo "discovered ${#tests[@]} test scripts"
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            if bash "${t}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${t}::${t} failed"
              failed+=("${t}")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "${#failed[@]} of ${#tests[@]} failed: ${failed[*]}"
            exit 1
          fi
          echo "all ${#tests[@]} passed"
