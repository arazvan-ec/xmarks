name: Validate plugins

# Validates the marketplace catalog and every plugin manifest (plus skill/agent/
# hook frontmatter) with the Claude Code CLI. Runs in --strict mode so that
# unrecognized fields and missing metadata fail the build.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "agents/**"
      - "hooks/**"
      - "scripts/**"
      - "upgrades/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate-plugins.yml"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "agents/**"
      - "hooks/**"
      - "scripts/**"
      - "upgrades/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate-plugins.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep CI runs offline-friendly: no auto-update or telemetry traffic.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: claude plugin validate . --strict

  test-installer:
    # End-to-end test of the vendored install path used for Claude Code web:
    # install twice (idempotence), assert the vendored result, then uninstall.
    # Also checks docs consistency: every skill/agent documented in README and
    # the /flywheel:help command map.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the test-pairing gate diffs against the PR base.
          fetch-depth: 0

      - name: Check script/test pairing (P22)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-pairing.sh "origin/${{ github.base_ref }}"

      - name: Test check-test-pairing.sh gate
        run: bash scripts/test-check-test-pairing.sh

      - name: Check skill description budget (P24)
        run: bash scripts/check-description-budget.sh

      - name: Test check-description-budget.sh gate
        run: bash scripts/test-check-description-budget.sh

      - name: Check eval fixtures for grading leaks (P26)
        run: bash scripts/check-fixture-leaks.sh

      - name: Test check-fixture-leaks.sh gate
        run: bash scripts/test-check-fixture-leaks.sh

      - name: Test the committed eval graders (P26)
        run: bash scripts/test-eval-graders.sh

      - name: Test install-vendored.sh
        run: bash scripts/test-install-vendored.sh

      - name: Test read-prime.sh hook
        run: bash scripts/test-read-prime.sh

      - name: Test write-allow.sh hook
        run: bash scripts/test-write-allow.sh

      - name: Test bash-allow.sh hook
        run: bash scripts/test-bash-allow.sh

      - name: Test session-start.sh hook
        run: bash scripts/test-session-start.sh

      - name: Test gate.sh hook
        run: bash scripts/test-gate.sh

      - name: Check docs consistency
        run: bash scripts/test-docs-consistency.sh
